name: Verify and package Windows
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after all checks pass
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/windows.yml']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci --no-audit --no-fund }
          else { npm install --no-audit --no-fund }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Financial regression tests
        run: npm test
      - name: Independent decimal oracle
        run: python tests/check_decimal.py
      - name: Install test browser
        run: npx playwright install chromium
      - name: Browser and privacy tests
        run: npm run test:browser
      - name: Build unsigned Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Test packaged startup and installer
        shell: pwsh
        run: ./scripts/windows-test.ps1
       - name: Record verification and checksums
        run: node scripts/verification.cjs
      - name: Publish only an explicitly approved release
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'release-approved: v0.1.0'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/release.ps1
