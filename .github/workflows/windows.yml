name: Verify and package Windows
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after all checks pass
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  windows:
    if: vars.CALFIN_SIGNING_READY == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci --no-audit --no-fund }
          else { npm install --no-audit --no-fund }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Financial regression tests
        run: npm test
      - name: Independent decimal oracle
        run: python tests/check_decimal.py
      - name: Install test browser
        run: npx playwright install chromium
      - name: Browser and privacy tests
        run: npm run test:browser
      - name: Consent and printed report tests
        run: npm run test:extensions
      - name: Build Windows installer with mandatory code signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Test packaged startup and installer
        shell: pwsh
        run: ./scripts/windows-test.ps1
      - name: Record verification and checksums
        run: node scripts/verification.cjs
      - name: Publish only an explicitly approved release
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          CALFIN_EXPECTED_SIGNER: ${{ vars.CALFIN_EXPECTED_SIGNER }}
        shell: pwsh
        run: ./scripts/release.ps1
